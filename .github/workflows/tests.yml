name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q acc
      - name: Install the optional MCP SDK so the interop test runs instead of skipping
        if: matrix.python == '3.13'
        run: python -m pip install mcp
      - name: Run the test suite
        run: |
          unset TYPESAFE_API_KEY
          python -m unittest discover -s tests -v
