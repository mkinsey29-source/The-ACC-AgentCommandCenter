name: Android native smoke
on:
  push:
    branches: [fix/android-build4-provider-crash-20261020]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acc-android-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare source and run focused checks
        run: |
          cd mobile
          npm ci --no-audit --no-fund
          unset TYPESAFE_API_KEY
          npm run test:native-props
          unset TYPESAFE_API_KEY
          npm run typecheck
          unset TYPESAFE_API_KEY
          npm run lint
          unset TYPESAFE_API_KEY
          npm run test:providers
          cd ..
          unset TYPESAFE_API_KEY
          python3 -m unittest discover -s tests -p test_mobile_runtime.py
          cd mobile
          npx expo prebuild --platform android --no-install
      - name: Native unit tests and standalone APK for tablet and emulator
        run: |
          unset TYPESAFE_API_KEY
          cd mobile/android
          ./gradlew :acc-chatgpt:testDebugUnitTest :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - name: Prepare Android emulator
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager 'system-images;android-36;google_apis;x86_64' 'emulator' 'platform-tools'
          echo no | avdmanager create avd --force --name acc-smoke --package 'system-images;android-36;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd acc-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: Test actual native provider setup panel
        run: |
          unset TYPESAFE_API_KEY
          adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
          python3 mobile/scripts/android-smoke.py
      - name: Verify numbered APK and upgrade signing identity
        run: |
          mkdir -p mobile/builds
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/builds/ACC-Android-build-4.apk
          curl -fL --retry 2 https://github.com/mkinsey29-source/The-ACC-AgentCommandCenter/releases/download/android-build-3/ACC-Android-build-3.apk -o "$RUNNER_TEMP/build3.apk"
          acc_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$acc_tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/build3.apk" > "$RUNNER_TEMP/build3-signature.txt"
          "$acc_tools/apksigner" verify --verbose --print-certs mobile/builds/ACC-Android-build-4.apk > "$RUNNER_TEMP/build4-signature.txt"
          "$acc_tools/zipalign" -c -P 16 -v 4 mobile/builds/ACC-Android-build-4.apk > "$RUNNER_TEMP/build4-alignment.txt"
          "$acc_tools/aapt" dump badging mobile/builds/ACC-Android-build-4.apk > "$RUNNER_TEMP/build4-badging.txt"
          "$acc_tools/aapt" dump xmltree mobile/builds/ACC-Android-build-4.apk AndroidManifest.xml > "$RUNNER_TEMP/build4-manifest.txt"
          python3 mobile/scripts/verify-release.py
      - name: Publish verified personal-test APK without Actions artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-build-4 >/dev/null 2>&1; then
            echo 'Build 4 already exists; refusing to overwrite a numbered release.'
            exit 1
          fi
          gh release create android-build-4 mobile/builds/ACC-Android-build-4.apk mobile/builds/build4-verification.json --target "$GITHUB_SHA" --prerelease --title 'ACC Android Build 4 — connection-panel crash fix' --notes-file mobile/builds/build4-release-notes.md
